<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Edit homepage | OctoPro</title>
<style>
:root{color-scheme:light;--ink:#1c1c1c;--soft:#5c5c5c;--yellow:#f9cd57}
body{margin:0;background:#fff;color:var(--ink);font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:72px 24px}
h1{font:800 28px/1.2 system-ui,sans-serif;margin:0 0 16px}
p{margin:0 0 16px;color:var(--soft)}
.button{display:inline-block;padding:10px 22px;background:var(--yellow);color:var(--ink);border-radius:10px;font:700 15px system-ui,sans-serif;text-decoration:none;margin:8px 0 24px}
.button:hover{background:var(--ink);color:#fff}
a{color:var(--ink)}
</style>
</head>
<body>
<main>
<h1>Edit the homepage</h1>
<a class="button" href="http://127.0.0.1:8790/">Open the editor</a>
<p>The editor runs on your Mac and starts by itself. It only opens on that Mac. If it doesn&rsquo;t open, double-click <b>Edit OctoPro homepage</b> on the Desktop.</p>
<p>This browser now shows an <b>Edit</b> button on the <a href="/">homepage</a>. Visitors never see it.</p>
</main>
<script>try{localStorage.setItem("octopro-editor","1")}catch(e){}</script>
</body>
</html>
