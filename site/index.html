<style>
/* INTERIM STYLE. All visual decisions live in this block, so a new design
   replaces this block and nothing else. System fonts only: nothing is fetched. */
:root {
	--bg: #ffffff;
	--ink: #14181f;
	--ink-soft: #4a5565;
	--hair: #dfe3ea;
	--accent: #1f3bd8;
	--accent-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #0e1116;
		--ink: #eef1f6;
		--ink-soft: #a9b3c3;
		--hair: #2a313c;
		--accent: #8ea2ff;
		--accent-ink: #0e1116;
	}
}
body {
	margin: 0;
	background: var(--bg);
	color: var(--ink);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	font-size: 19px;
	line-height: 1.6;
	overflow-wrap: break-word;
}
main {
	max-width: 40rem;
	margin: 0 auto;
	padding: 4rem 16px 5rem;
}
h1 {
	font-size: clamp(2rem, 6vw, 2.75rem);
	line-height: 1.15;
	margin: 0 0 2.5rem;
}
h2 {
	font-size: 1.2rem;
	line-height: 1.4;
	font-weight: 400;
	color: var(--ink-soft);
	margin: 0 0 1.5rem;
	padding-top: 1.5rem;
	border-top: 1px solid var(--hair);
}
.readings {
	list-style: none;
	margin: 0;
	padding: 0;
}
.readings li {
	padding: 1.25rem 0;
	border-bottom: 1px solid var(--hair);
}
.readings h3 {
	font-size: 1.15rem;
	line-height: 1.3;
	margin: 0 0 0.35rem;
}
.readings p {
	margin: 0 0 0.9rem;
	color: var(--ink-soft);
}
.button {
	display: inline-block;
	padding: 0.45rem 1rem;
	background: var(--accent);
	color: var(--accent-ink);
	border-radius: 4px;
	text-decoration: none;
	font-weight: 700;
	font-size: 0.95rem;
}
.button:hover,
.button:focus-visible {
	text-decoration: underline;
}
</style>
</head>
<body>
<main>
<h1>Site under construction</h1>
<h2>Here are a few readings I recommend, which also show my thinking</h2>

</ul>

</main>
